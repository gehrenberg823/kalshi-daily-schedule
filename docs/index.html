, "event_url": "https://kalshi.com/markets/kx/m/kxmlsgame-26aug19seaatx", "thunderpick_url": ""}, {"num": 578, "event": "Salt Lake vs Dallas", "sub_title": "RSL vs DAL (Aug 19)", "league": "Soccer (MLS)", "date": "Aug 19", "start_time": "8:30 PM CT", "sort_key": 1787189400.0, "event_ticker": "KXMLSGAME-26AUG19RSLDAL", "event_url": "https://kalshi.com/markets/kx/m/kxmlsgame-26aug19rsldal", "thunderpick_url": ""}, {"num": 579, "event": "Colorado vs Los Angeles F", "sub_title": "COL vs LAFC (Aug 19)", "league": "Soccer (MLS)", "date": "Aug 19", "start_time": "8:30 PM CT", "sort_key": 1787189400.0, "event_ticker": "KXMLSGAME-26AUG19COLLAFC", "event_url": "https://kalshi.com/markets/kx/m/kxmlsgame-26aug19collafc", "thunderpick_url": ""}, {"num": 580, "event": "Phoenix Rising vs Colorado Springs Sw.", "sub_title": "PHO vs CSS (Aug 19)", "league": "USL Championship", "date": "Aug 19", "start_time": "9:00 PM CT", "sort_key": 1787191200.0, "event_ticker": "KXUSLGAME-26AUG19PHOCSS", "event_url": "https://kalshi.com/markets/kx/m/kxuslgame-26aug19phocss", "thunderpick_url": ""}, {"num": 581, "event": "Vancouver vs Houston", "sub_title": "VAN vs HOU (Aug 19)", "league": "Soccer (MLS)", "date": "Aug 19", "start_time": "9:30 PM CT", "sort_key": 1787193000.0, "event_ticker": "KXMLSGAME-26AUG19VANHOU", "event_url": "https://kalshi.com/markets/kx/m/kxmlsgame-26aug19vanhou", "thunderpick_url": ""}, {"num": 582, "event": "Portland vs San Diego FC", "sub_title": "POR vs SD (Aug 19)", "league": "Soccer (MLS)", "date": "Aug 19", "start_time": "9:30 PM CT", "sort_key": 1787193000.0, "event_ticker": "KXMLSGAME-26AUG19PORSD", "event_url": "https://kalshi.com/markets/kx/m/kxmlsgame-26aug19porsd", "thunderpick_url": ""}, {"num": 583, "event": "Los Angeles G vs San Jose", "sub_title": "LAG vs SJ (Aug 19)", "league": "Soccer (MLS)", "date": "Aug 19", "start_time": "9:30 PM CT", "sort_key": 1787193000.0, "event_ticker": "KXMLSGAME-26AUG19LAGSJ", "event_url": "https://kalshi.com/markets/kx/m/kxmlsgame-26aug19lagsj", "thunderpick_url": ""}], "leagues": ["APF Division de Honor", "ASEAN Championship", "Allsvenskan", "Argentina Primera Division", "Argentine Nacional B", "BSN Puerto Rico", "Belgian Pro League", "Bolivia Premier Division", "Brasileiro Serie A", "Brasileiro Serie B", "Brasileiro Serie C", "CONMEBOL Libertadores", "CONMEBOL Sudamericana", "CS2", "Canadian Premier League", "Caribbean Premier League", "Champions League", "Chile Liga de Primera", "Club Friendlies", "Colombian Liga DIMAYOR", "Community Shield", "Coppa Italia", "Coppa Italia Lega Pro", "Croatia HNL", "Czech First League", "Czech National Football League", "Danish Superliga", "EFL Championship", "Ecuador LigaPro", "Eerste Divisie", "Ekstraklasa", "Eliteserien", "Eredivisie", "Eredivisie Vrouwen", "Ettan", "Faroe Islands Premier League", "Finnish Ykkosliiga", "German 3. Liga", "Greek Cup", "Japan NPB", "Korea KBO", "La Liga 2", "Liga Leumit", "Liga MX", "Liga Portugal", "Liga de Expansion MX", "LoL", "MLB", "Mexico LMB", "Mexico LNBP", "NWSL", "Olympic Qualifiers (W)", "One-Day Cup", "Pan American Cup 2026", "Peru Liga 1", "Premier Lacrosse League", "Premier League Cup", "Pro Padel League (M)", "Rocket League", "Scottish League Cup", "Serbian SuperLiga", "Slovakian 2. Liga", "Slovakian Cup", "Slovenian Prva Liga", "Soccer (La Liga)", "Soccer (MLS)", "Super Lig", "T20 (M)", "T20 International (M)", "TFF 1. Lig", "Test Series Sri Lanka vs. India", "The Hundred (M)", "The Hundred (W)", "Titled Tuesday", "UAE Pro League", "USL Championship", "Uruguay Primera Division", "Valorant", "Venezuela Liga FUTVE", "Vietnam VBA", "WNBA"], "dates": [{"key": "Aug 16", "label": "Sun Aug 16"}, {"key": "Aug 17", "label": "Mon Aug 17"}, {"key": "Aug 18", "label": "Tue Aug 18"}, {"key": "Aug 19", "label": "Wed Aug 19"}]};
const nowSec = () => Date.now() / 1000;
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

document.getElementById("meta").textContent =
  `Generated: ${DATA.generated_at} · ${DATA.rows.length} events`;

let table;
let activeDate = DATA.dates[0].key;
let activeLeagues = new Set();   // empty = All
let autoScrolled = false;

function applyFilters() {
  table.column(3).search("^" + esc(activeDate) + "$", true, false);
  const lg = activeLeagues.size
    ? "^(" + [...activeLeagues].map(esc).join("|") + ")$" : "";
  table.column(2).search(lg, true, false);
  table.draw();
  renderLeagueChips();
}

// --- Date filter ---
const dateBar = document.getElementById("date-filters");
const dateLbl = document.createElement("span");
dateLbl.className = "filter-label";
dateLbl.textContent = "Date";
dateBar.appendChild(dateLbl);

const DATE_COUNTS = DATA.rows.reduce((acc, r) => {
  acc[r.date] = (acc[r.date] || 0) + 1;
  return acc;
}, {});

DATA.dates.forEach(d => {
  const b = document.createElement("button");
  b.innerHTML = `${d.label} <span class="count">${DATE_COUNTS[d.key] || 0}</span>`;
  b.dataset.date = d.key;
  if (d.key === activeDate) b.classList.add("active");
  b.addEventListener("click", () => {
    document.querySelectorAll("#date-filters button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    activeDate = d.key;
    applyFilters();
  });
  dateBar.appendChild(b);
});

// --- League filter: multi-select chips, ordered by event count on the active
// date; leagues with nothing on that date don't render a chip at all. ---
function renderLeagueChips() {
  const bar = document.getElementById("league-filters");
  bar.innerHTML = "";
  const lbl = document.createElement("span");
  lbl.className = "filter-label";
  lbl.textContent = "League";
  bar.appendChild(lbl);

  const counts = {};
  let total = 0;
  DATA.rows.forEach(r => {
    if (r.date !== activeDate) return;
    counts[r.league] = (counts[r.league] || 0) + 1;
    total++;
  });

  const mk = (label, count, on, click) => {
    const b = document.createElement("button");
    b.innerHTML = `${label} <span class="count">${count}</span>`;
    if (on) b.classList.add("active");
    b.addEventListener("click", click);
    bar.appendChild(b);
  };

  mk("All", total, activeLeagues.size === 0, () => { activeLeagues.clear(); applyFilters(); });

  DATA.leagues
    .filter(lg => counts[lg])
    .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
    .forEach(lg => mk(lg, counts[lg], activeLeagues.has(lg), () => {
      activeLeagues.has(lg) ? activeLeagues.delete(lg) : activeLeagues.add(lg);
      applyFilters();
    }));
}

// --- "now" awareness + hour structure: dim rows that already started, break
// the list with a light divider whenever the hour changes, and (when the
// visible list is time-sorted and spans the current moment) a NOW divider.
const hourLbl = k => new Date(k * 1000).toLocaleTimeString("en-US",
  { hour: "numeric", timeZone: "America/Chicago" });
function markNow(api) {
  document.querySelectorAll("tr.now-divider, tr.hr-divider").forEach(el => el.remove());
  const ord = api.order();
  const timeAsc = ord.length && ord[0][0] === 4 && ord[0][1] === "asc";
  const now = nowSec();
  let past = 0, firstFuture = null, prevHour = null;
  api.rows({ search: "applied", order: "applied" }).every(function () {
    const d = this.data(), tr = this.node();
    const isPast = d.sort_key && d.sort_key < now;
    tr.classList.toggle("past", !!isPast);
    if (isPast) past++;
    else if (!firstFuture) firstFuture = tr;
    // hour dividers (skip TBD rows, whose sort_key is a far-future sentinel)
    if (timeAsc && d.sort_key && d.sort_key < 4e9) {
      const h = hourLbl(d.sort_key);
      if (prevHour !== null && h !== prevHour) {
        const div = document.createElement("tr");
        div.className = "hr-divider";
        div.innerHTML = `<td colspan="5">${h}</td>`;
        tr.parentNode.insertBefore(div, tr);
      }
      prevHour = h;
    }
  });
  if (timeAsc && past > 0 && firstFuture) {
    const tr = document.createElement("tr");
    tr.className = "now-divider";
    const lbl = new Date().toLocaleTimeString("en-US",
      { hour: "numeric", minute: "2-digit", timeZone: "America/Chicago" });
    tr.innerHTML = `<td colspan="5">now · ${lbl} CT</td>`;
    firstFuture.parentNode.insertBefore(tr, firstFuture);
    if (!autoScrolled) {
      autoScrolled = true;
      setTimeout(() => tr.scrollIntoView({ block: "center" }), 0);
    }
  }
}

table = new DataTable("#tbl", {
  data: DATA.rows,
  paging: false,
  order: [[4, "asc"]],
  drawCallback: function () { markNow(this.api()); },
  columns: [
    { data: null, className: "num", width: "40px", orderable: false, searchable: false,
      render: (d, t, row, meta) => meta.row + 1 },
    { data: "event",
      render: (d, t, row) => {
        if (t !== "display") return d;
        if (row.sub_title && row.sub_title !== d) return `${d} <span style="color:#888;font-size:12px">${row.sub_title}</span>`;
        return d;
      }
    },
    { data: "league" },
    { data: "date", visible: false },
    { data: "start_time", className: "time",
      render: (d, t, row) => {
        if (t === "sort" || t === "type") return row.sort_key;
        if (d === "TBD") return `<span class="tbd">TBD</span>`;
        if (t !== "display") return d;
        const dt = row.sort_key - nowSec();
        if (dt > 0 && dt < 6 * 3600) {
          const m = Math.round(dt / 60);
          const rel = m < 60 ? `in ${m}m` : `in ${Math.floor(m / 60)}h ${m % 60}m`;
          return `${d} <span class="rel">${rel}</span>`;
        }
        return d;
      }
    },
    { data: "event_ticker", className: "ticker",
      render: (d, t, row) => {
        if (t === "sort" || t === "type" || t === "filter") return d || "";
        if (!d) return "";
        return `<a href="${row.event_url}" target="_blank" rel="noopener">${d}</a>`;
      }
    },
  ],
});

// Apply initial filters (also builds the league chips)
applyFilters();

// Keep the dimming, divider position, and "in Xm" labels current
setInterval(() => table.draw(false), 60000);
</script>
